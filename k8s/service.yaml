apiVersion: v1
kind: Service
metadata:
  name: inventory-app-service
  namespace: default
  labels:
    app: inventory-app
spec:
  # Type de service - LoadBalancer pour une IP externe
  type: LoadBalancer
  
  # Sélecteur pour trouver les pods
  selector:
    app: inventory-app
  
  # Ports exposés
  ports:
    - name: http
      protocol: TCP
      port: 80  # Port du service
      targetPort: 5000  # Port du conteneur
      nodePort: 30080  # Port sur le node (optionnel, 30000-32767)
  
  # Session affinity (optionnel)
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-app-service-headless
  namespace: default
spec:
  clusterIP: None  # Headless service pour discovery
  selector:
    app: inventory-app
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-app-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: inventory.local  # À modifier selon votre domaine
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inventory-app-service
            port:
              number: 80
