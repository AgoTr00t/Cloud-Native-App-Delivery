name: CI/CD Pipeline - Build and Push to Docker Hub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Déclenchement manuel possible
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  IMAGE_NAME: inventory-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    # Étape 1: Récupération du code
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Récupère tout l'historique pour le versioning
    
    # Étape 2: Configuration de Docker Buildx (pour les builds avancés)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        version: latest
    
    # Étape 3: Connexion à Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.AGOTR00T }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    # Étape 4: Génération des métadonnées pour les tags
    - name: Generate metadata
      id: meta
      run: |
        # Version basée sur la date et le commit
        VERSION="v1.0.${{ github.run_number }}"
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    
    # Étape 5: Construction et push de l'image
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.SHORT_SHA }}
        # Cache pour accélérer les builds
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Métadonnées de l'image
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.created=${{ steps.meta.outputs.DATE }}
          org.opencontainers.image.revision=${{ github.sha }}
    
    # Étape 6: Vérification que l'image a bien été pushée
    - name: Verify image
      run: |
        echo "✅ Image successfully pushed to Docker Hub"
        echo "📦 Image: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
        echo "🏷️ Tags: latest, ${{ steps.meta.outputs.VERSION }}, ${{ steps.meta.outputs.SHORT_SHA }}"
    
    # Étape 7: Notification (optionnelle)
    - name: Send notification
      if: success()
      run: |
        echo "::notice::Pipeline réussi ! Image disponible sur Docker Hub"
